<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../estilos.css">

</head>
<body>
    <script>
        const productos = [
            { nombre: "Ratón", precio: 15, stock: 12 },
            { nombre: "Teclado", precio: 25, stock: 3 },
            { nombre: "Monitor", precio: 120, stock: 4 },
            { nombre: "Webcam", precio: 40, stock: 8 }
            ];

        let total = 0;

            for (let i = 0; i < productos.length; i++) {
            if (productos[i].stock < 5) {
                console.log("Pocas unidades: " + productos[i].nombre);
            }
            total = total + productos[i].precio * productos[i].stock;
            }

            console.log("Valor total: " + total);
    </script>
</body>
</html>
