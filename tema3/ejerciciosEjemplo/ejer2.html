<body>
    <script>
     function diasHasta(fecha) {
    const hoy = new Date();
    const diferencia = fecha - hoy;      
    const dias = diferencia / 86400000;  
    return Math.ceil(dias);              
}

const miCumple = new Date(2026, 6, 17);
console.log(diasHasta(miCumple));
    </script>
