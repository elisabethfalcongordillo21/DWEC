<body>
    <script>
        function cambiarTema() {
            let tema = localStorage.getItem("tema");

            if (tema === null) {
                tema = "claro";
            }

            if (tema === "claro") {
                tema = "oscuro";
            } else {
                tema = "claro";
            }

            localStorage.setItem("tema", tema);
            console.log("Tema actual: " + tema);
        }

        cambiarTema(); 
        cambiarTema(); 
        cambiarTema(); 
    </script>
