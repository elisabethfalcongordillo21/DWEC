<body>
    <h1>Ejercicio 9</h1>
 
<script>
  var milista = ['panadero', 456, [0, 1, 2]];
 
  document.write("milista[0] = " + milista[0] + "<br>");
  document.write("milista[1] = " + milista[1] + "<br>");
  document.write("milista[2][0] = " + milista[2][0] + "<br>");
  document.write("milista[2][1] = " + milista[2][1] + "<br>");
  document.write("milista[2][2] = " + milista[2][2] + "<br>");
</script>
 
<p>Sí se puede crear el array y sí se puede usar milista[2][2]: milista[2] es el array [0, 1, 2] y su posición 2 vale 2.</p>
</body>
