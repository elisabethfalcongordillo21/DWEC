<!DOCTYPE html>

    <title>Ejercicio 7 - Number() </title>
</head>
<body>
    <h1>Ejercicio 7: resultado de Number()</h1>
<script>
  document.write(Number("9 9"));
  document.write("<br>");
  document.write(Number("dos"));
</script>
 
<p>Las dos dan NaN (Not a Number): "9 9" tiene un espacio en medio y "dos" son letras, así que no se pueden convertir a número.</p>
</body>
